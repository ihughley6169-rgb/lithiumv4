<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lithium Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --bg:#0b0a16; --bg2:#151126; --accent:#7a5cff; --blue:#00bfff; --text:#eeeaff; --muted:#a8a4c5; --surface:rgba(255,255,255,.065); --border:rgba(255,255,255,.12); --radius:16px; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
    body { padding:22px; overflow-x:hidden; background:radial-gradient(circle at 15% 0%,rgba(122,92,255,.25),transparent 32%),radial-gradient(circle at 90% 20%,rgba(0,191,255,.14),transparent 28%),var(--bg); }
    body:before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.22; background:radial-gradient(circle at 50% 100%,rgba(122,92,255,.14),transparent 42%); }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .shell { max-width:1500px; margin:auto; }
    .glass { border:1px solid var(--border); background:var(--surface); box-shadow:0 20px 65px rgba(0,0,0,.36); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
    .header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:13px 22px; border-radius:var(--radius); }
    .brand { display:flex; align-items:center; gap:11px; color:var(--text); text-decoration:none; }.brand-icon { width:41px; height:41px; display:grid; place-items:center; border-radius:12px; color:#fff; background:linear-gradient(135deg,var(--accent),var(--blue)); box-shadow:0 0 28px rgba(122,92,255,.3); font-weight:800; }.brand-text { color:var(--text); font:800 20px Orbitron,sans-serif; letter-spacing:.04em; }.brand-text span { color:var(--muted); font:500 12px Inter,sans-serif; }
    .header-actions { display:flex; gap:9px; }.icon-btn { width:40px; height:40px; display:grid; place-items:center; border:1px solid var(--border); border-radius:11px; color:var(--text); background:rgba(255,255,255,.06); }.icon-btn:hover { color:#fff; border-color:var(--accent); background:var(--accent); transform:translateY(-2px); }
    .controls { display:flex; flex-wrap:wrap; gap:12px; margin:24px 0; }.search-wrap { position:relative; flex:1 1 320px; }.search-wrap i { position:absolute; top:50%; left:16px; color:var(--muted); transform:translateY(-50%); }.controls input,.controls select { width:100%; padding:13px 17px 13px 44px; border:1px solid var(--border); border-radius:12px; outline:0; color:var(--text); background:var(--surface); backdrop-filter:blur(12px); }.controls select { flex:0 1 190px; padding-left:16px; }.controls input:focus,.controls select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(122,92,255,.18); }.controls option { color:var(--text); background:var(--bg2); }
    .stats { display:flex; align-items:center; gap:13px; margin:0 0 18px; color:var(--muted); font-size:12px; }.stats strong { color:var(--text); }
    #container { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:18px; }.game-card { position:relative; overflow:hidden; border:1px solid var(--border); border-radius:var(--radius); color:var(--text); text-align:left; background:var(--surface); box-shadow:0 12px 35px rgba(0,0,0,.2); opacity:0; animation:pop .45s cubic-bezier(.2,.8,.2,1) forwards; transition:.25s; }.game-card:hover { z-index:1; border-color:var(--accent); box-shadow:0 18px 45px rgba(122,92,255,.24); transform:translateY(-7px) scale(1.02); }.cover { position:relative; aspect-ratio:1; overflow:hidden; background:linear-gradient(135deg,#28204f,#0d1028); }.cover img { width:100%; height:100%; display:block; object-fit:cover; transition:.5s; }.game-card:hover .cover img { transform:scale(1.1); }.play { position:absolute; inset:0; display:grid; place-items:center; opacity:0; color:#fff; background:rgba(0,0,0,.45); transition:.2s; }.game-card:hover .play { opacity:1; }.play i { font-size:42px; filter:drop-shadow(0 4px 14px #000); }.provider { position:absolute; top:9px; right:9px; padding:4px 8px; border:1px solid rgba(255,255,255,.2); border-radius:999px; color:#fff; background:rgba(0,0,0,.55); font-size:9px; text-transform:uppercase; }.game-name { padding:13px 12px; border-top:1px solid var(--border); font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.empty { grid-column:1/-1; padding:70px 20px; color:var(--muted); text-align:center; }.empty i { display:block; margin-bottom:14px; font-size:38px; opacity:.35; }
    @keyframes pop { from { opacity:0; transform:translateY(18px) scale(.96); } to { opacity:1; transform:none; } }
    .overlay { position:fixed; inset:0; z-index:20; display:none; place-items:center; padding:22px; background:rgba(0,0,0,.84); backdrop-filter:blur(20px); }.overlay.open { display:grid; }.modal { width:min(1200px,100%); height:min(88vh,900px); display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg2); box-shadow:0 30px 90px #000; }.modal-head { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:13px 18px; border-bottom:1px solid var(--border); background:var(--surface); }.modal-title { overflow:hidden; font:700 14px Orbitron,sans-serif; text-overflow:ellipsis; white-space:nowrap; }.modal-actions { display:flex; gap:7px; }.modal-actions button { width:36px; height:36px; border:1px solid var(--border); border-radius:10px; color:var(--text); background:var(--surface); }.modal-actions button:hover { border-color:var(--accent); color:#fff; background:var(--accent); }.game-frame { flex:1; width:100%; border:0; background:#000; }
    .settings-overlay { position:fixed; inset:0; z-index:30; display:none; place-items:center; padding:20px; background:rgba(0,0,0,.78); backdrop-filter:blur(18px); }.settings-overlay.open { display:grid; }.settings { width:min(670px,100%); max-height:90vh; overflow:auto; padding:28px; border-radius:var(--radius); }.settings h2 { margin:0 0 22px; font:700 19px Orbitron,sans-serif; }.settings-group { margin-bottom:25px; }.settings-label { display:block; margin-bottom:10px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }.theme-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:9px; }.theme-btn { padding:8px 5px; border:2px solid var(--border); border-radius:10px; color:var(--text); background:var(--surface); font-size:10px; }.theme-btn.active { border-color:var(--accent); }.swatch { width:29px; height:29px; margin:0 auto 6px; border-radius:8px; }.setting-close { display:flex; justify-content:flex-end; }.primary { padding:10px 16px; border:0; border-radius:10px; color:#fff; background:var(--accent); }
    @media (max-width:650px) { body { padding:12px; }.header { padding:11px 13px; }.brand-text { font-size:15px; }.brand-text span { display:none; } #container { grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); gap:11px; }.game-name { font-size:12px; }.modal { height:94vh; }.settings { padding:20px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header glass"><a class="brand" href="./"><span class="brand-icon">Li</span><span class="brand-text">Lithium<span>.SH / GAMES</span></span></a><div class="header-actions"><button class="icon-btn" id="settings-toggle" title="Settings"><i class="fa-solid fa-sliders"></i></button></div></header>
    <section class="controls"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Search games..." autocomplete="off"></div><select id="category" aria-label="Filter category"><option value="">All categories</option><option value="action">Action</option><option value="racing">Racing</option><option value="skill">Skill</option><option value="classic">Classic</option><option value="sports">Sports</option></select></section>
    <div class="stats"><span><strong id="count">0</strong> games</span><span>•</span><span>local Lithium library</span></div>
    <section id="container"></section>
  </main>
  <div class="overlay" id="game-overlay"><section class="modal"><header class="modal-head"><span class="modal-title" id="game-title">Lithium Game</span><div class="modal-actions"><button id="game-fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button><button id="game-newtab" title="Open new tab"><i class="fa-solid fa-up-right-from-square"></i></button><button id="game-close" title="Close"><i class="fa-solid fa-xmark"></i></button></div></header><iframe class="game-frame" id="game-frame" title="Lithium game"></iframe></section></div>
  <div class="settings-overlay" id="settings-overlay"><section class="settings glass"><h2><i class="fa-solid fa-sliders"></i> Lithium Games Settings</h2><div class="settings-group"><span class="settings-label">Theme</span><div class="theme-grid" id="theme-grid"></div></div><div class="setting-close"><button class="primary" id="settings-close">Done</button></div></section></div>
  <script>
    const fallback = [
      ['Slope','skill'],['Geometry Dash','skill'],['Drive Mad','racing'],['Brotato','action'],['Run 3','skill'],['Drift Boss','racing'],['Tiny Fishing','sports'],['Cluster Rush','action'],['Snow Rider 3D','racing'],['OvO','skill'],['Tunnel Rush','racing'],['Crazy Cattle 3D','action'],['Stickman Hook','skill'],['Slow Roads','racing'],['PolyTrack','racing'],['Tap Road','racing'],['Rooftop Snipers','action'],['Level Devil','skill'],['Monkey Mart','classic'],['2048','classic'],['Vex 5','skill'],['Bloxorz','classic'],['Block Blast','classic'],['Flappy Bird','skill'],['Basket Random','sports'],['Moto X3M','racing'],['Fruit Ninja','action'],['Shell Shockers','action'],['Going Balls','skill'],['Hextris','classic']
    ];
    const themes = { violet:['#0b0a16','#7a5cff','#00bfff'], cyber:['#030b12','#00d9ff','#39ff88'], sunset:['#1b0a0e','#ff6f61','#ffc857'], matrix:['#001006','#00e45d','#a8ff78'], midnight:['#070812','#647cff','#c39bff'], rose:['#180810','#ff4f9a','#ffb86b'] };
    let games = fallback.map(([name,category]) => ({name,category,url:`../games/${encodeURIComponent(name)}.html`,cover:`https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=17142e&color=ffffff&size=512&font-size=0.28&bold=true`}));
    let current = null;
    const root = document.documentElement;
    const container = document.querySelector('#container');
    function applyTheme(name) { const theme=themes[name]; if (!theme) return; root.style.setProperty('--bg',theme[0]); root.style.setProperty('--bg2',`${theme[0]}cc`); root.style.setProperty('--accent',theme[1]); root.style.setProperty('--blue',theme[2]); localStorage.setItem('lithium-games-theme',name); renderThemes(name); }
    function renderThemes(active) { document.querySelector('#theme-grid').innerHTML=Object.entries(themes).map(([name,colors]) => `<button class="theme-btn ${name===active?'active':''}" data-theme="${name}"><span class="swatch" style="background:linear-gradient(135deg,${colors[1]},${colors[2]})"></span>${name}</button>`).join(''); document.querySelectorAll('[data-theme]').forEach((button) => button.addEventListener('click',() => applyTheme(button.dataset.theme))); }
    function render() { const query=document.querySelector('#search').value.toLowerCase(); const category=document.querySelector('#category').value; const list=games.filter((game) => game.name.toLowerCase().includes(query) && (!category || game.category === category)); document.querySelector('#count').textContent=list.length; container.innerHTML=list.length ? list.map((game,index) => `<button class="game-card" data-game="${encodeURIComponent(game.name)}" style="animation-delay:${Math.min(index*.025,.8)}s"><span class="cover"><img src="${game.cover}" alt="${game.name}" loading="lazy"><span class="play"><i class="fa-solid fa-circle-play"></i></span><small class="provider">${game.category}</small></span><span class="game-name">${game.name}</span></button>`).join('') : '<div class="empty"><i class="fa-solid fa-gamepad"></i>No games found.</div>'; container.querySelectorAll('[data-game]').forEach((card) => card.addEventListener('click',() => openGame(decodeURIComponent(card.dataset.game)))); }
    function openGame(name) { current=games.find((game) => game.name === name); if (!current) return; document.querySelector('#game-title').textContent=current.name; document.querySelector('#game-frame').src=current.url; document.querySelector('#game-overlay').classList.add('open'); }
    document.querySelector('#search').addEventListener('input',render); document.querySelector('#category').addEventListener('change',render); document.querySelector('#settings-toggle').addEventListener('click',() => document.querySelector('#settings-overlay').classList.add('open')); document.querySelector('#settings-close').addEventListener('click',() => document.querySelector('#settings-overlay').classList.remove('open')); document.querySelector('#game-close').addEventListener('click',() => { document.querySelector('#game-overlay').classList.remove('open'); document.querySelector('#game-frame').src='about:blank'; }); document.querySelector('#game-newtab').addEventListener('click',() => { if (current) window.open(current.url,'_blank'); }); document.querySelector('#game-fullscreen').addEventListener('click',() => document.querySelector('#game-frame').requestFullscreen?.());
    fetch('https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json').then((response) => response.json()).then((data) => { const remote=data.filter((item) => item.id !== -1 && item.name && !item.name.startsWith('[!]')).map((item) => ({name:item.name,category:'classic',url:item.url.startsWith('http')?item.url:`https://cdn.jsdelivr.net/gh/freebuisness/html@main/${item.url.replace('{HTML_URL}','')}`,cover:item.cover?`https://cdn.jsdelivr.net/gh/freebuisness/covers@main/${item.cover.replace('{COVER_URL}','')}`:`https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=17142e&color=ffffff&size=512&font-size=0.28&bold=true`})); if (remote.length) { games=remote; render(); } }).catch(() => {});
    const saved=localStorage.getItem('lithium-games-theme') || 'violet'; applyTheme(saved); render();
  </script>
</body>
</html>
