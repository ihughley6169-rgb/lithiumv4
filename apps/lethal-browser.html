    <script>
      (function () {
        var bookmarkKey = "lithium-browser-bookmarks";
        var historyKey = "lithium-browser-history";
        var extensionKey = "lithium-browser-extensions";
        var builtinExtensions = [
          { id: "reader", name: "Reader mode", description: "Improve typography on any page.", enabled: true },
          { id: "dim", name: "Dim the web", description: "Reduce harsh white backgrounds.", enabled: false }
        ];
        var panels = ["bookmarks-panel", "history-panel", "extensions-panel"];
        var urlInput = document.getElementById("lethal-url");
        var tabs = document.getElementById("lethal-tabs");

        function read(key, fallback) {
          try { return JSON.parse(localStorage.getItem(key) || "null") || fallback; } catch (e) { return fallback; }
        }
        function write(key, value) {
          try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
        }
        function currentUrl() {
          var raw = window.location.hash.slice(1);
          try { raw = decodeURIComponent(raw); } catch (e) {}
          return raw || "https://example.com";
        }
        function navigate(url) {
          var value = String(url || "").trim();
          if (!value) return;
          if (!/^https?:\/\//i.test(value)) value = "https://" + value;
          window.location.hash = value;
        }
        function closePanels() {
          panels.forEach(function (id) { document.getElementById(id).classList.remove("open"); });
        }
        function togglePanel(id) {
          var panel = document.getElementById(id);
          var open = panel.classList.contains("open");
          closePanels();
          if (!open) panel.classList.add("open");
        }
        function domain(url) {
          try { return new URL(url).hostname; } catch (e) { return url; }
        }
        function renderBookmarks() {
          var list = document.getElementById("bookmarks-list");
          var items = read(bookmarkKey, []);
          list.innerHTML = items.length ? items.map(function (item, index) {
            return '<div class="lethal-item"><span>★</span><span title="' + item.url.replace(/"/g, "&quot;") + '">' + (item.title || domain(item.url)) + '</span><button data-bookmark="' + index + '">Open</button></div>';
          }).join("") : '<span class="lethal-empty">No bookmarks yet. Star the current page to save it.</span>';
          list.querySelectorAll("[data-bookmark]").forEach(function (button) {
            button.onclick = function () { navigate(items[Number(button.dataset.bookmark)].url); closePanels(); };
          });
        }
        function renderHistory() {
          var list = document.getElementById("history-list");
          var items = read(historyKey, []);
          list.innerHTML = items.length ? items.slice(0, 20).map(function (item, index) {
            return '<div class="lethal-item"><span>' + (index + 1) + '</span><span title="' + item.url.replace(/"/g, "&quot;") + '">' + (item.title || domain(item.url)) + '</span><button data-history="' + index + '">Open</button></div>';
          }).join("") : '<span class="lethal-empty">Your browsing history will appear here.</span>';
          list.querySelectorAll("[data-history]").forEach(function (button) {
            button.onclick = function () { navigate(items[Number(button.dataset.history)].url); closePanels(); };
          });
        }
        function extensionState() {
          var saved = read(extensionKey, {});
          return builtinExtensions.map(function (item) { return Object.assign({}, item, { enabled: saved[item.id] === undefined ? item.enabled : saved[item.id] }); });
        }
        function applyExtensions() {
          var frame = document.querySelector("#iframe-container iframe");
          if (!frame) return;
          try {
            var doc = frame.contentDocument;
            if (!doc || !doc.head) return;
            var old = doc.getElementById("lithium-browser-extensions");
            if (old) old.remove();
            var style = doc.createElement("style");
            style.id = "lithium-browser-extensions";
            var active = extensionState().filter(function (item) { return item.enabled; });
            style.textContent = active.map(function (item) {
              return item.id === "reader" ? "body{font-family:Georgia,serif!important;line-height:1.65!important} p,article,main{max-width:74ch!important}" : "html{filter:brightness(.84) saturate(.9)!important}";
            }).join("\n");
            doc.head.appendChild(style);
          } catch (e) {}
        }
        function renderExtensions() {
          var list = document.getElementById("extensions-list");
          list.innerHTML = extensionState().map(function (item) {
            return '<div class="lethal-item"><span>◈</span><span><strong>' + item.name + '</strong><br><small>' + item.description + '</small></span><button data-extension="' + item.id + '">' + (item.enabled ? "On" : "Off") + '</button></div>';
          }).join("");
          list.querySelectorAll("[data-extension]").forEach(function (button) {
            button.onclick = function () {
              var state = read(extensionKey, {}); var id = button.dataset.extension;
              state[id] = !extensionState().find(function (item) { return item.id === id; }).enabled;
              write(extensionKey, state); renderExtensions(); applyExtensions();
            };
          });
        }
        function renderTabs() {
          var items = read(historyKey, []).slice(0, 6);
          var current = currentUrl();
          tabs.innerHTML = items.map(function (item) {
            return '<button class="lethal-tab' + (item.url === current ? ' active' : '') + '" data-tab-url="' + encodeURIComponent(item.url) + '">' + (item.title || domain(item.url)).slice(0, 24) + '</button>';
          }).join("");
          tabs.querySelectorAll("[data-tab-url]").forEach(function (button) { button.onclick = function () { navigate(decodeURIComponent(button.dataset.tabUrl)); }; });
        }
        function sync() {
          var url = currentUrl();
          urlInput.value = url;
          var items = read(historyKey, []).filter(function (item) { return item.url !== url; });
          items.unshift({ url: url, title: domain(url), visitedAt: Date.now() });
          write(historyKey, items.slice(0, 50));
          renderBookmarks(); renderHistory(); renderExtensions(); renderTabs();
          setTimeout(applyExtensions, 900);
          var frame = document.querySelector("#iframe-container iframe");
          if (frame) frame.addEventListener("load", applyExtensions, { once: true });
          document.getElementById("lethal-bookmark").textContent = read(bookmarkKey, []).some(function (item) { return item.url === url; }) ? "★" : "☆";
        }
        document.getElementById("lethal-back").onclick = function () { window.history.back(); };
        document.getElementById("lethal-forward").onclick = function () { window.history.forward(); };
        document.getElementById("lethal-reload").onclick = function () { window.dispatchEvent(new HashChangeEvent("hashchange")); };
        document.getElementById("lethal-bookmark").onclick = function () {
          var url = currentUrl(); var items = read(bookmarkKey, []); var existing = items.findIndex(function (item) { return item.url === url; });
          if (existing >= 0) items.splice(existing, 1); else items.unshift({ url: url, title: domain(url) });
          write(bookmarkKey, items); sync();
        };
        document.getElementById("lethal-bookmarks").onclick = function () { togglePanel("bookmarks-panel"); renderBookmarks(); };
        document.getElementById("lethal-history").onclick = function () { togglePanel("history-panel"); renderHistory(); };
        document.getElementById("lethal-extensions").onclick = function () { togglePanel("extensions-panel"); renderExtensions(); };
        document.getElementById("lethal-nav").addEventListener("submit", function () { closePanels(); });
        document.getElementById("bookmarks-panel").addEventListener("click", function (event) { if (event.target === this) closePanels(); });
        urlInput.addEventListener("focus", function () { urlInput.select(); });
        urlInput.addEventListener("keydown", function (event) { if (event.key === "Escape") urlInput.blur(); });
        document.addEventListener("click", function (event) {
          if (!event.target.closest("#lethal-nav, #lethal-panels, #lethal-tabs")) closePanels();
        });
        document.addEventListener("keydown", function (event) {
          var modifier = event.ctrlKey || event.metaKey;
          if (modifier && event.key.toLowerCase() === "l") {
            event.preventDefault(); urlInput.focus(); urlInput.select();
          } else if (modifier && event.key.toLowerCase() === "d") {
            event.preventDefault(); document.getElementById("lethal-bookmark").click();
          } else if (event.altKey && event.key === "ArrowLeft") {
            event.preventDefault(); window.history.back();
          } else if (event.altKey && event.key === "ArrowRight") {
            event.preventDefault(); window.history.forward();
          }
        });
        window.addEventListener("hashchange", sync);
        sync();
      })();
    </script>
